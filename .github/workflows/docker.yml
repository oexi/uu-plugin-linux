name: Docker image

on:
  push:
    paths-ignore:
      - '**.md'
  workflow_dispatch:

env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository }}
  # The repository was renamed from uu-plugin-linux-arm64; keep publishing the old image name for existing installs
  LEGACY_IMAGE: ghcr.io/oexi/uu-plugin-linux-arm64
  # Only publish from the default branch and version tags; other branches just build
  PUSH: ${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}

permissions:
  contents: read
  packages: write

jobs:
  build:
    # x86_64 runner: the amd64 image compiles qemu-aarch64 natively (cached); the arm images
    # only install Alpine packages and copy files, so building them under QEMU is quick
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ env.REGISTRY_IMAGE }}
            ${{ env.LEGACY_IMAGE }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=sha

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64,arm

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/arm64,linux/arm/v7,linux/amd64
          labels: ${{ steps.meta.outputs.labels }}
          tags: ${{ steps.meta.outputs.tags }}
          push: ${{ env.PUSH }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test-amd64:
    # Runs the amd64 image on a runner without binfmt_misc for aarch64, so the plugin and the guardian it
    # starts can only run through the image's own qemu-aarch64
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build amd64 image (from cache)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          tags: uu:test
          load: true
          cache-from: type=gha

      - name: Run and wait for the plugin to log in
        run: sh docker/test-amd64.sh uu:test
