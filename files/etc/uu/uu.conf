# 网易 UU 加速器（H3C NX30Pro 插件移植版）配置
# 修改后执行：systemctl restart uu

# 局域网网卡名。留空 = 自动取默认路由所在网卡（旁路网关通常只有这一张网卡）
LAN_IF=""

# 插件下载类型：https://router.uu.163.com/api/plugin?type=h3c-<型号小写>&sn=<SN>
# 型号和 SN 从 /etc/uu/factoryinfo 读取（productname / manucode），安装时按本机 MAC 自动生成

# ---- 旁路网关 ----
# 1 = 开启转发，让局域网设备把本机 IP 设为网关即可上网/加速
GATEWAY=1
# 1 = 对从本机转发出去的局域网流量做 MASQUERADE（旁路网关标准做法，避免主路由回程绕过本机）
MASQUERADE=1

# ---- IPv6 ----
# 1 = 本机同时作为 IPv6 旁路网关，插件可以加速设备的 IPv6 流量：
#     开启 IPv6 转发，并由 dnsmasq 发送路由通告（RA），把本机通告为高优先级 IPv6 默认路由器和 DNS。
#     注意：RA 是对整个局域网广播的，开启后局域网内所有接受 RA 的设备，其 IPv6 流量都会经过本机
#     （IPv6 做不到像 IPv4 那样只让手动指定网关的设备走本机）。本机停机后客户端约 3 分钟内回落到主路由。
# 0 = 只接管 IPv4，设备的 IPv6 仍直接走主路由
IPV6=0

# ---- DNS ----
# 1 = 在本机局域网 IP 的 53 端口运行 dnsmasq，局域网设备可把 DNS 设为本机 IP
# 若本机 53 端口已被其它 DNS 服务（AdGuard Home 等）占用，设为 0
DNS=1
# 上游 DNS，空格分隔；留空 = 使用系统当前的上游（systemd-resolved 的真实上游或 /etc/resolv.conf）
DNS_UPSTREAM=""

# ---- 更新 ----
# 1 = 每次服务启动时向网易服务器检查插件最新版本，有新版先下载再启动
UPDATE_ON_START=1
# 启动时等待网络/更新服务器可用的最长秒数，超时则先用本地缓存版本启动，之后后台继续检查
UPDATE_WAIT=120
